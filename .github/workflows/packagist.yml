# Sync Packagist when a stable release tag is pushed (see .packagist.yml — no dev-main).
# Requires repository secret PACKAGIST_TOKEN (Packagist profile → Show API Token).
name: Packagist

on:
  push:
    tags:
      - 'v*'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Packagist update
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_TOKEN" ]; then
            echo '::warning::PACKAGIST_TOKEN secret not set — skipping. Fix GitHub webhook secret or add this secret.'
            exit 0
          fi
          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${PACKAGIST_USER:-alvesbeto}:${PACKAGIST_TOKEN}" \
            -d '{"repository":"https://github.com/alvesbeto/mysql2pdo"}' \
            "https://packagist.org/api/update-package"
          echo "Packagist update requested for alvesbeto/mysql2pdo"
